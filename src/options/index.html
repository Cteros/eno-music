<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <base target="_blank">
  <title>ENO-MUSIC</title>
  <style>
    html, body {
      margin: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif;
      background: #000;
      color: #fff;
    }

    #eno-splash {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      animation: splash-life 2.1s ease forwards;
      pointer-events: none;
    }

    #eno-splash .splash-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #eno-splash .splash-tally {
      width: 3px;
      height: 22px;
      background: #1ed760;
      transform: scaleY(0);
      transform-origin: center;
      animation: splash-tally 0.42s 0.06s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #eno-splash .splash-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      opacity: 0;
      transform: translate3d(-8px, 0, 0);
      animation: splash-name 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splash-tally {
      to { transform: scaleY(1); }
    }

    @keyframes splash-name {
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes splash-life {
      0%, 70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      #eno-splash {
        animation: splash-life 0.7s linear forwards;
      }

      #eno-splash .splash-tally,
      #eno-splash .splash-name {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div id="eno-splash" aria-hidden="true">
    <div class="splash-row">
      <span class="splash-tally"></span>
      <span class="splash-name">ENO-M</span>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
